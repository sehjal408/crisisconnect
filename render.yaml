# ── CrisisConnect — Render Blueprint ─────────────────────────────────────────
# One file that tells Render how to deploy the whole app: the Node/Express
# backend (with its embedded PostgreSQL database) and the static React frontend.
#
# How to use it: push this repo to GitHub, then on Render click
#   New +  →  Blueprint  →  pick this repo.
# Render reads this file and creates both services. See DEPLOYMENT.md for the
# full walkthrough (including the ANTHROPIC_API_KEY you set by hand).
#
# The live demo runs on PGlite (real PostgreSQL embedded in the backend), so it
# no longer depends on Render's free Postgres, which expires after 30 days. Demo
# data is re-seeded automatically whenever the free instance restarts.

services:
  # ── Backend API (Node/Express) ─────────────────────────────────────────────
  - type: web
    name: crisisconnect-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Embedded PostgreSQL (PGlite). Set to "pg" plus DATABASE_URL to use an
      # external PostgreSQL server (e.g. Neon) instead.
      - key: DB_DRIVER
        value: pglite
      # Keep the JS heap small so the whole process stays well under the free
      # plan's 512 MB (PGlite boots from backend/db/pglite-base.tgz to skip initdb).
      - key: NODE_OPTIONS
        value: --max-old-space-size=192
      # A strong random signing secret is generated for you.
      - key: JWT_SECRET
        generateValue: true
      # Set this by hand in the dashboard (Environment tab). Leave empty to run
      # on the offline triage heuristic instead of Claude.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional: lock CORS to the frontend URL once you know it.
      - key: CORS_ORIGIN
        value: ""

  # ── Frontend (static React build served by Render's CDN) ───────────────────
  - type: web
    name: crisisconnect-web
    runtime: static
    rootDir: frontend
    # NODE_ENV=production would skip Vite (a devDependency), so include dev deps.
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      # Must match the backend service's public URL. If you rename the API
      # service, update this to https://<that-name>.onrender.com
      - key: VITE_API_URL
        value: https://crisisconnect-api-p7qw.onrender.com
    routes:
      # Single-page app: send every path to index.html so client routing works.
      - type: rewrite
        source: /*
        destination: /index.html
